# Nginx 리버스 프록시 — /etc/nginx/sites-available/playground 로 복사하고
#   sudo ln -s /etc/nginx/sites-available/playground /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 이 파일은 **TLS 발급 전** 상태다(80만). 도메인 A 레코드가 붙은 뒤
#   sudo certbot --nginx -d playgroundsport.com -d www.playgroundsport.com
# 을 돌리면 certbot이 443 서버 블록과 리다이렉트를 자동으로 추가한다.

server {
    listen 80;
    listen [::]:80;
    server_name playgroundsport.com www.playgroundsport.com;

    # Blazor WASM은 프레임워크 파일이 크다 — 압축과 캐시가 체감 속도를 좌우한다
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/octet-stream image/svg+xml;
    gzip_min_length 1024;

    # 앱이 미리 만든 .br/.gz 자산을 그대로 내보낸다(재압축하지 않음)
    location ~ \.(js|css|wasm|dat|dll|json)$ {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # 앱이 원래 스킴·클라이언트 IP를 알아야 한다.
        # **앱 쪽에 UseForwardedHeaders가 없으면 UseHttpsRedirection이 무한 리다이렉트를 만든다** —
        # Nginx가 TLS를 끝내고 http로 넘기기 때문이다 (Docs/Development/Deployment.md "아직 남은 것").
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_cache_bypass $http_upgrade;

        # 데이터 내려받기(export zip)는 오래 걸릴 수 있다
        proxy_read_timeout 300s;
    }

    # 업로드 — 이미지·게시판 첨부. 앱의 상한과 맞춘다.
    client_max_body_size 20m;
}
